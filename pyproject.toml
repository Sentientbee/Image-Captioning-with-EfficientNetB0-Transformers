[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-captioning-transformers"
version = "1.0.0"
description = "End-to-End Image Captioning using EfficientNetB0 visual encoder and Transformer decoder with Cross-Attention Visualization"
readme = "README.md"
authors = [
    { name = "Mayank Gour" }
]
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.12.0",
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "nltk>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
